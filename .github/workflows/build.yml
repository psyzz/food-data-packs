name: Build data packs

on:
  schedule:
    # The Open Food Facts export is refreshed around 06:40 UTC.
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build the country databases
        run: node --no-warnings build.mjs --out dist

      - name: Publish databases and deltas
        run: node --no-warnings release.mjs --dist dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repository activity.
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            date -u +%FT%TZ > last-keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add last-keepalive.txt
            git commit -m "Keep the daily build alive"
            git push
          fi
